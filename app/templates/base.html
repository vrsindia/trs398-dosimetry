{% block title %}DOSE pro{% endblock %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DOSE pro{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="topnav">
    <a class="nav-brand brand-title" href="/">DOSE pro</a>
    <div class="nav-links">
      <a href="/">Home</a>
      {% if current_user %}
      <span class="muted small">{{ current_user.full_name }} ({{ current_user.role }})</span>
      <a href="/logout">Logout</a>
      {% endif %}
    </div>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
