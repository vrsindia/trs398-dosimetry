<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Linac</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <strong>Linac Absolute Dosimetry</strong>
        <a href="/">← Home</a>
    </header>
    <main>
        <div class="card">
            <div class="step">Step 1</div>
            <h1>Select Linac</h1>
            {% for linac in linacs %}
            <a class="machine-card" href="/linac/{{ linac.id }}">
                {{ linac.name }}
                <div class="meta">{{ linac.manufacturer }} {{ linac.model }}{% if linac.location %} · {{ linac.location }}{% endif %}</div>
            </a>
            {% else %}
            <p style="color:var(--text-muted);">No linacs. <a href="/linacs">Add one</a>.</p>
            {% endfor %}
        </div>
    </main>
</body>
</html>
