<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — DOSE pro</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
  <style>
    body.login-page {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(59,130,246,0.18), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(6,182,212,0.10), transparent 50%),
        var(--bg);
      padding: 1.5rem;
    }
    .login-top {
      position: fixed;
      top: 0; right: 0; left: 0;
      display: flex;
      justify-content: flex-end;
      padding: 0.75rem 1.25rem;
      z-index: 10;
    }
    .login-shell { width: 100%; max-width: 420px; }
    .login-brand { text-align: center; margin-bottom: 1.75rem; }
    .login-brand h1 {
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
      background: linear-gradient(135deg, #60a5fa 0%, #22d3ee 50%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-brand p {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.75rem 1.6rem 1.5rem;
      box-shadow: var(--shadow);
    }
    .login-card h2 {
      margin: 0 0 1.15rem;
      font-size: 1.15rem;
      font-weight: 650;
      color: var(--text);
    }
    .login-card label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.9rem;
    }
    .login-card label input {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.95rem;
    }
    .login-card label input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.28);
    }
    .btn-login {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
    }
    .btn-login:hover { filter: brightness(1.08); }
    .login-error {
      background: var(--danger-bg);
      border: 1px solid rgba(239,68,68,0.35);
      color: var(--danger);
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .login-foot {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 1.5rem;
      line-height: 1.45;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-top">
    <button type="button" class="nav-btn nav-btn-ghost" id="theme-toggle">Light theme</button>
  </div>
  <div class="login-shell">
    <div class="login-brand">
      <h1>DOSE pro</h1>
      <p>Clinical dosimetry solution</p>
    </div>
    <div class="login-card">
      <h2>Sign in</h2>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <label>
          Username
          <input type="text" name="username" required autofocus autocomplete="username" placeholder="e.g. developer">
        </label>
        <label>
          Password
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn-login">Sign in</button>
      </form>
    </div>
    <p class="login-foot">
      Access is restricted. Contact your administrator for credentials.<br>
      DOSE pro · TRS-398 clinical dosimetry
    </p>
  </div>
</body>
</html>
