<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — DOSE pro</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body.login-page {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(59,130,246,0.22), transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(6,182,212,0.12), transparent 50%),
        radial-gradient(ellipse 50% 40% at 0% 100%, rgba(139,92,246,0.10), transparent 50%),
        var(--bg, #0f1419);
      padding: 1.5rem;
    }
    .login-shell {
      width: 100%;
      max-width: 420px;
    }
    .login-brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .login-brand h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
      background: linear-gradient(135deg, #60a5fa 0%, #22d3ee 50%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-brand p {
      margin: 0.45rem 0 0;
      color: var(--muted, #8b9bb4);
      font-size: 0.95rem;
    }
    .login-card {
      background: var(--surface, #1a2332);
      border: 1px solid var(--border, #2d3a4f);
      border-radius: 14px;
      padding: 1.75rem 1.6rem 1.5rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(59,130,246,0.06);
    }
    .login-card h2 {
      margin: 0 0 1.15rem;
      font-size: 1.15rem;
      font-weight: 650;
      color: var(--text, #e8eef7);
    }
    .login-card label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted, #8b9bb4);
      margin-bottom: 0.9rem;
    }
    .login-card label input {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border, #2d3a4f);
      background: var(--surface-2, #243044);
      color: var(--text, #e8eef7);
      font-size: 0.95rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .login-card label input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.28);
    }
    .login-card .btn-login {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
    }
    .login-card .btn-login:hover {
      filter: brightness(1.08);
      box-shadow: 0 6px 18px rgba(37,99,235,0.45);
    }
    .login-card .btn-login:active {
      transform: translateY(1px);
    }
    .login-error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5;
      padding: 0.7rem 0.9rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .login-foot {
      text-align: center;
      color: var(--muted, #8b9bb4);
      font-size: 0.8rem;
      margin-top: 1.5rem;
      line-height: 1.45;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-brand">
      <h1>DOSE pro</h1>
      <p>Clinical dosimetry solution</p>
    </div>
    <div class="login-card">
      <h2>Sign in</h2>
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login">
        <label>
          Username
          <input type="text" name="username" required autofocus autocomplete="username" placeholder="e.g. developer">
        </label>
        <label>
          Password
          <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </label>
        <button type="submit" class="btn-login">Sign in</button>
      </form>
    </div>
    <p class="login-foot">
      Access is restricted. Contact your administrator for credentials.
    </p>
  </div>
</body>
</html>
