<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beam Quality Index</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <strong>Beam Quality Index</strong>
        <a href="/session/{{ session.id }}/energies">Skip → Energies</a>
    </header>
    <main>
        <div class="card">
            <div class="step">Step 4 – Photon</div>
            <h1>TPR<sub>20,10</sub></h1>
            <form method="post" action="/session/{{ session.id }}/quality">
                <div class="grid grid-2">
                    <div><label>Reading / Dose at 10 cm</label><input type="number" step="any" name="dose_10" required></div>
                    <div><label>Reading / Dose at 20 cm</label><input type="number" step="any" name="dose_20" required></div>
                </div>
                <button type="submit" style="margin-top:1.2rem; width:100%;">Calculate TPR<sub>20,10</sub></button>
            </form>
            {% if qi %}
            <div class="result-box result-pass" style="margin-top:1.2rem;">
                <div>TPR<sub>20,10</sub> = <strong style="font-size:1.5rem;">{{ "%.4f"|format(qi.tpr20_10) }}</strong></div>
                <p class="note">{{ qi.notes }}</p>
                <a href="/session/{{ session.id }}/energies" class="btn" style="margin-top:0.8rem;">Continue to Energies →</a>
            </div>
            {% endif %}
        </div>
    </main>
</body>
</html>
