<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correction Factors</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <strong>{{ linac.name }} · {{ modality|capitalize }}</strong>
        <a href="/linac/{{ linac.id }}">← Back</a>
    </header>
    <main>
        <div class="card">
            <div class="step">Step 3 – Shared Correction Factors</div>
            <h1>Calculate k<sub>TP</sub>, k<sub>pol</sub>, k<sub>s</sub></h1>
            <p style="color:var(--text-muted);">Reused for all energies in this session.</p>
            <form method="post" action="/session/{{ session.id }}/corrections">
                <div class="grid grid-2">
                    <div><label>Temperature (°C)</label><input type="number" step="any" name="temperature_C" value="20.0" required></div>
                    <div><label>Pressure (hPa)</label><input type="number" step="any" name="pressure_hPa" value="1013.25" required></div>
                </div>
                <div class="grid grid-2">
                    <div><label>Reading + polarity (nC)</label><input type="number" step="any" name="M_plus" value="20.0" required></div>
                    <div><label>Reading − polarity (nC)</label><input type="number" step="any" name="M_minus" value="19.95" required></div>
                </div>
                <div class="grid grid-2">
                    <div><label>Reading at V1 (higher)</label><input type="number" step="any" name="M1" value="20.0" required></div>
                    <div><label>Reading at V2 (lower)</label><input type="number" step="any" name="M2" value="19.7" required></div>
                </div>
                <div class="grid grid-2">
                    <div><label>V1 (V)</label><input type="number" step="any" name="V1" value="300" required></div>
                    <div><label>V2 (V)</label><input type="number" step="any" name="V2" value="100" required></div>
                </div>
                <label>Detector</label>
                <select name="detector_id">
                    <option value="">— Select —</option>
                    {% for d in detectors %}
                    <option value="{{ d.id }}">{{ d.name }} ({{ "%.5f"|format(d.calibration_factor) }})</option>
                    {% endfor %}
                </select>
                <button type="submit" style="margin-top:1.3rem; width:100%;">Calculate &amp; Continue</button>
            </form>
        </div>
    </main>
</body>
</html>
